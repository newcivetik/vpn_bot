name: Fix Deploy

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix and redeploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /root/vpn_bot

            # Clean stuck node_modules
            rm -rf mini-app/node_modules
            rm -rf admin/node_modules

            # Rebuild mini-app
            cd /root/vpn_bot/mini-app
            npm ci
            npm run build
            rm -rf /var/www/vpn-mini-app/*
            cp -r dist/* /var/www/vpn-mini-app/

            # Rebuild admin
            cd /root/vpn_bot/admin
            npm ci
            npm run build
            rm -rf /var/www/vpn-admin/*
            cp -r dist/* /var/www/vpn-admin/

            nginx -s reload
            echo "Done!"
