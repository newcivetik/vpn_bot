name: Check Logs

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            echo "=== PM2 STATUS ==="
            pm2 list
            echo ""
            echo "=== LAST 50 LINES OF LOGS ==="
            pm2 logs vpn-bot --lines 50 --nostream
            echo ""
            echo "=== ENV CHECK ==="
            cd /root/vpn_bot/backend
            grep YOKASSA .env
            echo ""
            echo "=== AUTH CHECK ==="
            grep MAX_AUTH /root/vpn_bot/backend/dist/shared/guards/telegram-auth.js
